<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1</title>
</head>
<body>
    <script>
        function greet(name,callback){
            document.write('Nice to meet you '+name+'!<br/>');
            callback();
        }

        function hello(){
            document.write('Hello World!');
        }

        greet('Utsav',hello);
    </script>
</body>
</html>
