<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2</title>
</head>
<body>
    <button id="mouseEvent">Click Here</button>
    <script>
        document.getElementById("mouseEvent").addEventListener('click',(event)=>{document.write("Left Mouse Button Clicked");});
        document.getElementById("mouseEvent").addEventListener('contextmenu',(event)=>{document.write("Right Mouse Button Clicked");});
    </script>
</body>
</html>
