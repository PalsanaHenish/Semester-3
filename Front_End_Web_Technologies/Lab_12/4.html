<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>

    <input type="text" id="txt">
    <p class="data"></p>
    <button id="dm">FetchData</button>

    <script>
        $('#dm').click(
            ()=>{$('.data').text($('#txt').val())}
        );
    </script>
</body>
</html>
