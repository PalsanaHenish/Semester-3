<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>

    <ul id="list">
        <li>Apple</li>
        <li>Ball</li>
        <li>Cat</li>
        <li>Dog</li>
    </ul>
    <button id="dm">AddItem</button>

    <script>
        $('#dm').click(
            ()=>{$('#list').append("<li>Hello World</li>")}
        );
    </script>
</body>
</html>
