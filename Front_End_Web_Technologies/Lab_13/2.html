<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1</title>
    <style>
      * {
        text-align: center;
        font-size: xx-large;
      }
      body {
        justify-items: center;
      }
      .id {
        width: 100px;
      }
      .name {
        width: 500px;
      }
      .action {
        width: 300px;
      }
      #add {
        background-color: rgb(2, 230, 2);
        border: none;
        border-radius: 10px;
        width: 100px;
        height: 50px;
      }
      #update {
        background-color: rgb(69, 69, 255);
        border: none;
        border-radius: 10px;
        width: 150px;
        height: 50px;
      }
      #edit {
        background-color: rgb(69, 69, 255);
        border: none;
        border-radius: 10px;
        width: 100px;
        height: 50px;
      }
      #delete {
        background-color: red;
        border: none;
        border-radius: 10px;
        width: 150px;
        height: 50px;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td><label for="fname">First Name</label></td>
        <td><input type="text" id="fname" /></td>
      </tr>
      <tr>
        <td><label for="lname">Last Name</label></td>
        <td><input type="text" id="lname" /></td>
      </tr>
      <tr>
        <td><label for="age">Age</label></td>
        <td><input type="number" id="age" /></td>
      </tr>
      <tr>
        <td><label for="sem">Semester</label></td>
        <td><input type="number" id="sem" /></td>
      </tr>
      <tr>
        <td><label for="roll">Rollnumber</label></td>
        <td><input type="number" id="roll" /></td>
      </tr>
    </table>

    <br>

    <button id="add" onclick="addStu()">ADD</button>

    <button id="update" onclick="updateStu()">UPDATE</button>

    <br>
    <br>

    <table border="1" cellspacing="0" width="1500px">
      <thead>
        <tr>
          <th class="id">ID</th>
          <th class="fname">FirstName</th>
          <th class="lname">LastName</th>
          <th class="age">Age</th>
          <th class="sem">Semester</th>
          <th class="roll">Rollnumber</th>
          <th class="action">Action</th>
        </tr>
      </thead>
      <tbody id="tablebody"></tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>

    <script>
      arr = [];
      temp = "";

      function display() {
        temp = "";
        for (i = 0; i < arr.length; i++) {
          temp += `
                <tr>
                    <td>${i + 1}</td>
                    <td>${arr[i].fname}</td>
                    <td>${arr[i].lname}</td>
                    <td>${arr[i].age}</td>
                    <td>${arr[i].sem}</td>
                    <td>${arr[i].roll}</td>
                    <td><button id="edit" onclick='editStu(${i})'>EDIT</button> <button id="delete" onclick='deleteStu(${i})'>DELETE</button></td>
                </tr>
                `;
        }
        $("#tablebody").html(temp);
      }

      function addStu() {
        student = {
          fname: $("#fname").val(),
          lname: $("#lname").val(),
          age: $("#age").val(),
          sem: $("#sem").val(),
          roll: $("#roll").val(),
        };

        if (
          student.fname == "" ||
          student.lname == "" ||
          student.age == "" ||
          student.sem == "" ||
          student.fname == "" ||
          student.roll == ""
        ) {
          alert("Please fill all the fields...!");
          return;
        }

        arr.push(student);
        display();
        $("#fname").val("");
        $("#lname").val("");
        $("#age").val("");
        $("#sem").val("");
        $("#roll").val("");
      }

      function deleteStu(i) {
        arr.splice(i, 1);
        display();
      }

      index = -1;
      function editStu(i) {
        $("#fname").val(arr[i].fname);
        $("#lname").val(arr[i].lname);
        $("#age").val(arr[i].age);
        $("#sem").val(arr[i].sem);
        $("#roll").val(arr[i].roll);
        index = i;
      }

      function updateStu() {
        if (index != -1) {
          arr[index].fname = $("#fname").val();
          arr[index].lname = $("#lname").val();
          arr[index].age = $("#age").val();
          arr[index].sem = $("#sem").val();
          arr[index].roll = $("#roll").val();
          display();
          $("#fname").val("");
          $("#lname").val("");
          $("#age").val("");
          $("#sem").val("");
          $("#roll").val("");
        } else {
          alert("Select Student Name!!!");
        }
        index = -1;
      }
    </script>
  </body>
</html>
